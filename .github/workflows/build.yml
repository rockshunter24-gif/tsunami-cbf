name: Build Tsunami CBF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Tsunami CBF
          path: ${{ steps.build.outputs.build-output }}

      # Also publish the .geode to the "builds" branch for a direct download link
      - name: Publish to builds branch
        run: |
          mkdir publish
          find "${{ steps.build.outputs.build-output }}" -name "*.geode" -exec cp {} publish/ \;
          ls -la publish
          cd publish
          git init -q
          git checkout -q -b builds
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
